const burst=(A,x,y,n,c,s=140,l=.7)=>{for(let i=0;i<n;i++){const a=Math.random()*6.28,v=s*(.3+Math.random());A.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:l*(.5+Math.random()*.5),l,c})}};

const drawPt=(A,ox=0,oy=0)=>{for(const q of A){X.globalAlpha=Math.max(0,q.t/q.l);circ(q.x-ox,q.y-oy,1.5+q.t*4,q.c)}X.globalAlpha=1};
const ext=(x,y,w,h,hg,hu,sa,l)=>{X.fillStyle='rgba(0,0,0,.3)';X.fillRect(x+hg*.8,y+hg*.8,w,h);for(let i=0;i<hg;i+=3){X.fillStyle=`hsl(${hu},${sa}%,${l-16+i/hg*9}%)`;X.fillRect(x-i*.25,y-i*.4,w,h)}
 const rx=x-hg*.25,ry=y-hg*.4;X.fillStyle=`hsl(${hu},${sa}%,${l}%)`;X.fillRect(rx,ry,w,h);X.strokeStyle='rgba(255,255,255,.25)';X.lineWidth=2;X.strokeRect(rx+1,ry+1,w-2,h-2);return[rx,ry]};

/* ===== shared: difficulty, sound, textures, minimap, post-fx ===== */
let DL=2,DF=1,HY=0;try{const v=parseInt(localStorage.getItem('a10dl'));if(v>=0&&v<=5)DL=v}catch(e){}DF=DL<2?0:DL<4?1:2;
const DN=['Very easy','Easy','Normal','Slightly hard','Hard','Very hard'];
const Z3=(a,b,c)=>{const t=[-.6,0,1,1.5,2,2.6][DL],i=t<1?0:1,f=t<1?t:t-1,P=[a,b,c],L=(u,v)=>{if(typeof u=='object'){const o={};for(const k in u)o[k]=L(u[k],v[k]);return o}let r=u+(v-u)*f;if(Number.isInteger(u)&&Number.isInteger(v))r=Math.max(Math.min(u,v)>0?1:0,Math.round(r));else if(u>=0&&v>=0&&r<0)r=0;return r};return L(P[i],P[i+1])};
const OP=Object.assign({wall:1,obs:1,spd:1},(()=>{try{return JSON.parse(localStorage.getItem('a10sn'))||{}}catch(e){return{}}})()),OPsave=()=>{try{localStorage.setItem('a10sn',JSON.stringify(OP))}catch(e){}};

/* --- synthesized sound (WebAudio, no files) --- */
const SFX=(()=>{let ac,mg,nb,on=true,L={};const LT={},GP={crash:.12,coin:.04,step:.1,thrust:.09,laser:.05,tick:.04,brick:.03,groan:.2,roar:.6,growl:.25,crackle:.08,whack:.05,hurt:.2,rock:.05,eat:.05,beat:.2};
try{on=localStorage.getItem('a10snd')!=='0'}catch(e){}
const ctx=()=>{if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();mg.gain.value=on?.55:0;const cp=ac.createDynamicsCompressor();mg.connect(cp);cp.connect(ac.destination);
  const dl=ac.createDelay(.6),fb=ac.createGain(),wt=ac.createGain();dl.delayTime.value=.19;fb.gain.value=.3;wt.gain.value=.2;mg.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wt);wt.connect(cp);
  const n=ac.sampleRate*2;nb=ac.createBuffer(1,n,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1}catch(e){ac=null}}
 if(ac&&ac.state=='suspended')ac.resume();return ac};
const tn=(f,d,ty='sine',v=.15,sl=0,dl=0)=>{const t=ac.currentTime+dl,o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+sl),t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.05)};
const nz=(d,f,v=.2,ty='lowpass',sl=0,dl=0,q=1)=>{const t=ac.currentTime+dl,s=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();s.buffer=nb;s.loop=true;fl.type=ty;fl.Q.value=q;fl.frequency.setValueAtTime(f,t);if(sl)fl.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl);fl.connect(g);g.connect(mg);s.start(t,Math.random());s.stop(t+d+.05)};
const loop=(id,mk)=>{if(!L[id])L[id]=mk();return L[id]};
const nsrc=(ft,fq,q)=>{const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=nb;s.loop=true;f.type=ft;f.frequency.value=fq;f.Q.value=q;g.gain.value=0;s.connect(f);f.connect(g);g.connect(mg);s.start();return{s,f,g}};
return{ctx,get on(){return on},
toggle(){on=!on;try{localStorage.setItem('a10snd',on?'1':'0')}catch(e){}if(ctx())mg.gain.setTargetAtTime(on?.55:0,ac.currentTime,.05);return on},
stopAll(){for(const k in L){try{L[k].stop()}catch(e){}}L={}},
/* engine: two detuned oscillators through a moving low-pass */
eng(sp,th,bo){if(!ctx())return;const e=loop('eng',()=>{const a=ac.createOscillator(),b=ac.createOscillator(),f=ac.createBiquadFilter(),g=ac.createGain();a.type='sawtooth';b.type='square';f.type='lowpass';g.gain.value=0;a.connect(f);b.connect(f);f.connect(g);g.connect(mg);a.start();b.start();return{a,b,f,g,stop(){g.gain.value=0;a.stop();b.stop()}}});
 const r=Math.min(1.5,sp/450),t=ac.currentTime;e.a.frequency.setTargetAtTime(48+r*140+(bo?40:0),t,.07);e.b.frequency.setTargetAtTime(24+r*70,t,.07);e.f.frequency.setTargetAtTime(220+r*520+th*160,t,.07);e.g.gain.setTargetAtTime(.016+.024*r+.009*Math.max(0,th),t,.08)},

 const t=ac.currentTime,f=Math.sin(tm*7)>0?960:720;s.o.frequency.setTargetAtTime(f,t,.03);s.o2.frequency.setTargetAtTime(f*2,t,.03);s.g.gain.setTargetAtTime(d<1400?.07*Math.pow(1-d/1400,1.5):0,t,.1)},

  return{stop(){n.g.gain.value=0;cg.gain.value=0;n.s.stop();l.stop();c.stop();lf.stop()}}}

 return{stop(){g.gain.value=0;a.stop();b.stop();l.stop()}}})},

switch(n){

case'lose':[392,370,349,311].forEach((f,i)=>tn(f,.5,'sawtooth',.1,-30,i*.22));nz(1,300,.15,'lowpass',-200,.3);tn(55,1,'sine',.35,-20,.5);break;
